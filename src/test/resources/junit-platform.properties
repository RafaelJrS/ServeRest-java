# ============================================================================
# Configuração da Plataforma JUnit 5 + Cucumber 7 (ServeRest API Automation)
# ============================================================================

# Oculta o banner publicitário do Cucumber no final do console
cucumber.publish.quiet=true

# Execução paralela (Padrão: false para manter a ordem determinística CT-01..CT-59 no relatório).
# Para ativar via terminal quando desejar máxima velocidade, rode:
# .\mvnw.cmd test "-Dcucumber.execution.parallel.enabled=true"
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
